<div class="auth-page">
  <div class="auth-card anim-scale-in veta-top">

    <div class="auth-head">
      <img src="img/logo-nogal.png" alt="Nogal Muebles" class="auth-logo">
      <h1 class="auth-title">Bienvenido de nuevo</h1>
      <p class="auth-subtitle">Inicia sesión en Comercial El Nogal</p>
    </div>

    <div class="auth-body">
      <div class="auth-field">
        <label for="txtUsername" class="form-label">Usuario</label>
        <div class="auth-input">
          <i class="bi bi-person" aria-hidden="true"></i>
          <input type="text" id="txtUsername" class="form-control"
                 placeholder="Ingresa tu usuario"
                 autocomplete="username"
                 [(ngModel)]="username"
                 (keyup.enter)="login()">
        </div>
      </div>

      <div class="auth-field">
        <label for="txtPassword" class="form-label">Contraseña</label>
        <div class="auth-input">
          <i class="bi bi-lock" aria-hidden="true"></i>
          <input type="password" id="txtPassword" class="form-control"
                 placeholder="Ingresa tu contraseña"
                 autocomplete="current-password"
                 [(ngModel)]="password"
                 (keyup.enter)="login()">
        </div>
      </div>

      <!-- Error accesible -->
      <div class="alert alert-danger" role="alert" aria-live="assertive" *ngIf="mensajeError">
        <i class="bi bi-exclamation-triangle-fill me-1" aria-hidden="true"></i>
        {{ mensajeError }}
      </div>

      <button class="btn btn-primary btn-lg w-100 auth-submit" (click)="login()">
        Iniciar sesión
        <i class="bi bi-arrow-right ms-1"></i>
      </button>

      <p class="auth-alt">
        ¿No tienes cuenta?
        <a href="javascript:void(0)" (click)="irARegistro()">Crea una aquí</a>
      </p>
    </div>

  </div>
</div>
